<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PaintMyWeb</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="launcher">
    <header class="brand-row">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div>
        <h1>PaintMyWeb<span>.</span></h1>
        <p class="tagline">Your browser. Your colors.</p>
      </div>
    </header>

    <section class="current-site" aria-labelledby="site-heading">
      <p class="eyebrow" id="site-heading">CURRENT SITE</p>
      <p class="site-name" id="site-name">Checking current page…</p>
      <p class="site-path" id="site-path"></p>
    </section>

    <label class="remember-row" for="remember">
      <span class="remember-copy">
        <strong>Keep changes after refresh</strong>
        <small>Save locally and restore on future visits to this site.</small>
      </span>
      <input id="remember" type="checkbox" checked>
    </label>

    <div class="permission-note" id="permission-note" role="status">
      Site access is requested only when you enable saving.
    </div>
    <div class="error-note" id="error-note" role="alert" hidden></div>

    <button class="start-button" id="start" type="button" disabled>
      <span>Open paint palette</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <footer><span>Personal edits, stored on your device.</span><span>v2.0.0</span></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
